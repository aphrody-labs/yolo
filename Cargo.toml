[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "MIT"
repository = "https://github.com/aphrody-labs/yolo"
homepage = "https://github.com/aphrody-labs/yolo"

# Aphrody forks (branch `yolo`) replace the upstream registry crates
[patch.crates-io]
tauri = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-build = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-utils = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-runtime = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-runtime-wry = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-codegen = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-macros = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-plugin = { git = "https://github.com/aphrody-labs/tauri", branch = "yolo" }
tauri-plugin-opener = { git = "https://github.com/aphrody-labs/plugins-workspace", branch = "yolo" }
wry = { git = "https://github.com/aphrody-labs/wry", branch = "yolo" }
tao = { git = "https://github.com/aphrody-labs/tao", branch = "yolo" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
