[workspace]
resolver = "3"
members = ["crates/*"]
# The default build is the shared native core. Desktop, Python and compiler
# providers remain workspace members selected explicitly by their build recipes.
default-members = ["crates/yolo-core", "crates/yolo-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "MIT"
repository = "https://github.com/aphrody-labs/yolo"
homepage = "https://github.com/aphrody-labs/yolo"

# Aphrody crates (imported by `yolo import`, see vendor.toml). The dependency key keeps the
# upstream name so `use tauri::...` is unchanged; only the package name is prefixed.
[workspace.dependencies]
rayon = "1.10"
pyo3 = { version = "0.29", features = ["extension-module"] }
tauri = { package = "aphrody-tauri", path = "crates/aphrody-tauri", version = "3.0.0-alpha.4" }
tauri-build = { package = "aphrody-tauri-build", path = "crates/aphrody-tauri-build", version = "3.0.0-alpha.3" }
tauri-plugin = { package = "aphrody-tauri-plugin", path = "crates/aphrody-tauri-plugin", version = "3.0.0-alpha.3" }
tauri-utils = { package = "aphrody-tauri-utils", path = "crates/aphrody-tauri-utils", version = "3.0.0-alpha.3" }
tauri-runtime = { package = "aphrody-tauri-runtime", path = "crates/aphrody-tauri-runtime", version = "3.0.0-alpha.3" }
tauri-runtime-wry = { package = "aphrody-tauri-runtime-wry", path = "crates/aphrody-tauri-runtime-wry", version = "3.0.0-alpha.4" }
tauri-macros = { package = "aphrody-tauri-macros", path = "crates/aphrody-tauri-macros", version = "3.0.0-alpha.3" }
tauri-codegen = { package = "aphrody-tauri-codegen", path = "crates/aphrody-tauri-codegen", version = "3.0.0-alpha.3" }
tauri-plugin-opener = { package = "aphrody-tauri-plugin-opener", path = "crates/aphrody-tauri-plugin-opener", version = "3.0.0-alpha.2" }
wry = { package = "aphrody-wry", path = "crates/aphrody-wry", version = "0.57.0" }
tao = { package = "aphrody-tao", path = "crates/aphrody-tao", version = "0.37.1" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

# Artifact boundary of the native runtime: panics must unwind so the C ABI can convert them to
# YoloStatus::Panic. The plain release profile aborts and is not used for this artifact.
[profile.runtime]
inherits = "release"
panic = "unwind"

[profile.dev.package.miniz_oxide]
opt-level = 3
