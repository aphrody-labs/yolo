[workspace]
resolver = "2"
members = [
    "crates/*",
]
exclude = [
    "packages/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "MIT"
repository = "https://github.com/aphrody-labs/yolo"
homepage = "https://github.com/aphrody-labs/yolo"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
