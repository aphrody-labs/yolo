# Aphrody YOLO — High-Performance Bun Engine Configuration (2026 Standards)
# Native zero-overhead execution, strict security, multithreading and instant bundler

[install]
# Deterministic dependency resolution, exact versions, and concurrent worker scripts
exact = true
concurrentScripts = 16
lockfile = true

[test]
# `runtime:*` virtual modules (sdk/runtime)
preload = ["./sdk/runtime/src/preload.ts"]
# Strict timeout budget, root isolated scope, UTC timezone
timeout = 10000
root = "tests"

[run]
# Force Bun runtime for shebangs and nested scripts
bun = true

[build]
# Bundler defaults: target latest web platform with sourcemaps & minify enabled
target = "browser"
minify = true
sourcemap = "none"
