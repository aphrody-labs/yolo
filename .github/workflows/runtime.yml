name: Runtime artifact

# Builds the precompiled runtime library (profile `runtime`, unwinding panics) for every supported
# target, runs the Rust and SDK tests against it and uploads dist/runtime/<target>/.
on:
  push:
    branches: [main, dev]
    paths:
      - "crates/yolo-core/**"
      - "crates/yolo-runtime/**"
      - "packages/runtime/**"
      - "scripts/release/runtime_*.ts"
      - "test/runtime_*.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "crates/yolo-core/**"
      - "crates/yolo-runtime/**"
      - "packages/runtime/**"
      - "scripts/release/runtime_*.ts"
      - "test/runtime_*.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/runtime.yml"

jobs:
  artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-core-${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify the native runner architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "$EXPECTED_TARGET"
          bun -e 'import { hostTarget } from "./packages/runtime/src/artifact.ts"; if (hostTarget() !== process.env.EXPECTED_TARGET) throw new Error(`Bun target ${hostTarget()} differs from ${process.env.EXPECTED_TARGET}`);'
      # This matrix distributes the minimal ABI; optional browser/desktop artifacts
      # have their own factory qualification and must not enter the default graph.
      - run: cargo test --locked --no-default-features -p yolo-core -p yolo-runtime
      - run: cargo build --locked --no-default-features --profile runtime -p yolo-runtime
      - run: bun run scripts/release/runtime_artifact.ts
      - run: bun test test/runtime_sdk.test.ts test/runtime_release.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: yolo-runtime-${{ matrix.target }}
          path: dist/runtime/${{ matrix.target }}
