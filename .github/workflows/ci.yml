name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  bun:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      YOLO_TOOLING_LIB: ${{ github.workspace }}/target/debug/libyolo_tooling.so
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: bun install --frozen-lockfile
      - name: Install the declared global quality tools
        run: bun add --global typescript@7.0.2 oxlint@1.86.0 oxfmt@0.71.0
      - run: tsc --noEmit
      - run: oxlint scripts/ test/ packages/ apps/cli/src/ apps/web/src/
      - run: oxfmt --check scripts/ test/ packages/ apps/cli/src/ apps/web/src/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tooling
      - name: Build the native provider used by Bun tests
        run: cargo build --locked -p yolo-tooling
      - run: bun test --timeout 30000 test/

  # Hosted runners are isolated; Cargo steps execute serially within each job.
  # Local/factory equivalents use the existing cargo-serial owner through just.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --check -p yolo-core -p yolo-runtime
      - run: cargo check --locked --no-default-features -p yolo-core -p yolo-runtime --all-targets
      - run: cargo clippy --locked --no-default-features -p yolo-core -p yolo-runtime --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-default-features -p yolo-core -p yolo-runtime --lib --bins --tests --no-fail-fast
      - run: cargo deny check licenses sources

  # Preserve the existing desktop and imported-source coverage independently of core.
  # Browser/V8 and compiler engine builds use `just factory <profile> <full-sha>`.
  desktop-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-imports
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p yolo-desktop --all-targets -- -D warnings
      - run: cargo check --locked --workspace --exclude aphrody-tauri-runtime-cef --exclude 'aphrody-turbo*' --exclude 'aphrody-next*' --exclude aphrody-auto-hash-map --exclude aphrody-swc-ast-explorer --all-targets
      - name: Owned desktop tests
        run: cargo nextest run --locked -p yolo-desktop --lib --bins --tests --no-fail-fast
      - name: Imported desktop tests (former default-member selection)
        run: >-
          cargo nextest run --locked --no-fail-fast --lib --bins --tests
          -p aphrody-tauri -p aphrody-tauri-build -p aphrody-tauri-codegen
          -p aphrody-tauri-driver -p aphrody-tauri-macros -p aphrody-tauri-plugin
          -p 'aphrody-tauri-plugin-*' -p aphrody-tauri-runtime -p aphrody-tauri-runtime-wry
          -p aphrody-tauri-utils -p aphrody-acl-tests -p aphrody-create-tauri-app
          -p aphrody-tao -p aphrody-tao-macros -p aphrody-wry

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Python adapter Rust tests (explicit optional package)
        run: cargo test --locked -p yolo-pyo3 --lib --bins --tests
      - name: Python linting and formatting
        run: |
          uv tool install ruff@latest
          ruff check packages/python
          ruff format --check packages/python
      - name: Python package build and test (Maturin + PyO3)
        run: |
          uv sync --locked --package yolo --extra dev
          uv run --package yolo --extra dev --no-sync -- python -m pytest packages/python/tests
