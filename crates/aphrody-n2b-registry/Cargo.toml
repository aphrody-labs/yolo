[package]
name = "aphrody-n2b-registry"
description = "N2B data-driven Node-to-Bun migration rule registry, embedded TOML validated at first use."
version = "0.6.2"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bun", "nodejs", "migration", "n2b", "rules"]
categories = ["development-tools"]
publish = true
authors = ["aphrody-code"]

[lib]
name = "aphrody_n2b_registry"
path = "src/lib.rs"

[dependencies]
aphrody-n2b-types.workspace = true
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
