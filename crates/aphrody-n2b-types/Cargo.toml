[package]
name = "aphrody-n2b-types"
description = "N2B shared types and the versioned JSON report schema."
version = "0.6.2"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bun", "nodejs", "migration", "n2b", "schema"]
categories = ["development-tools"]
publish = true
authors = ["aphrody-code"]

[dependencies]
serde = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
