[package]
name = "aphrody-n2b-native"
description = "N2B C ABI helpers for Bun (bun:ffi), such as UTF-16 newline indexing."
version = "0.2.0"
edition.workspace = true
rust-version = "1.97"
authors = ["aphrody-code"]
license = "Apache-2.0"
publish = false

[lib]
name = "aphrody_n2b_native"
crate-type = ["rlib"]

[dependencies]
aphrody-n2b-core = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
