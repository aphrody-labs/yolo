[package]
name = "yolo-desktop"
version.workspace = true
publish = false
description = "Tauri 3 Desktop Native Shell for YOLO Monorepo"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "yolo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.4", features = [] }
tauri-plugin-opener = "3.0.0-alpha.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yolo-core = { path = "../yolo-core" }
