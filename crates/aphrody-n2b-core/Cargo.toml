[package]
name = "aphrody-n2b-core"
description = "N2B engine: rules, scanners, reports, audit, run orchestration, manifest handling, report card and llms.txt generation."
version = "0.6.2"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bun", "nodejs", "migration", "codemod", "n2b"]
categories = ["development-tools"]
publish = true

[lib]
name = "aphrody_n2b_core"
path = "src/lib.rs"

[dependencies]
yolo-core = { path = "../yolo-core" }
aphrody-n2b-types.workspace = true
aphrody-n2b-registry.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml.workspace = true
anyhow = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
memchr = { workspace = true }
crossbeam-channel = { workspace = true }
ignore.workspace = true
globset.workspace = true
colored.workspace = true
url.workspace = true
walkdir.workspace = true
which.workspace = true
reqwest.workspace = true
octocrab.workspace = true
tokio.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_span.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
serde_json = { workspace = true }

[features]
default = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
